# ===========================================================================
# Environnement conda du projet Transport & Logistique
#
# Utilisation :
#     conda env create -f environment.yml
#     conda activate transport-logistique
#     jupyter lab
#
# Pour utiliser ce même environnement dans VSCode :
#     Ctrl+Shift+P → Python: Select Interpreter
#     → .../anaconda3/envs/transport-logistique/python.exe
#
# Le périmètre technique est limité à pandas, statistiques et visualisation,
# conformément au cahier des charges.
# ===========================================================================

name: transport-logistique

channels:
  - conda-forge

dependencies:
  # --- Python -------------------------------------------------------------
  - python=3.11

  # --- Manipulation des données --------------------------------------------
  - pandas>=2.0
  - numpy>=1.24

  # --- Calcul statistique -------------------------------------------------
  - scipy>=1.10

  # --- Visualisation ------------------------------------------------------
  - matplotlib-base>=3.7
  - seaborn>=0.12
  - tabulate>=0.9

  # --- Environnement Jupyter ----------------------------------------------
  - jupyterlab>=4.0
  - notebook>=7.0
  - ipykernel>=6.25
